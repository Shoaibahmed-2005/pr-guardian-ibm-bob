[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-guardian"
version = "0.1.0"
description = "Automated PR review with IBM Bob IDE integration"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "PR Guardian Team", email = "contact@pr-guardian.dev"}
]
keywords = ["pr-review", "code-analysis", "ibm-bob", "mcp-server", "security", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    # Core Dependencies
    "click>=8.1.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    
    # Data Validation & Config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    
    # HTTP & API Clients
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "pygithub>=2.1.0",
    "python-gitlab>=4.0.0",
    
    # Git Operations
    "gitpython>=3.1.0",
    
    # Template Engine
    "jinja2>=3.1.0",
    
    # AI/LLM Integration
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "ibm-watson>=7.0.0",
    "ibm-watsonx-ai>=0.1.0",
    
    # MCP Protocol
    "mcp>=0.9.0",
    
    # Code Analysis
    "radon>=6.0.0",
    "bandit>=1.7.0",
    "pylint>=3.0.0",
    
    # Utilities
    "python-dateutil>=2.8.0",
    "tenacity>=8.2.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "responses>=0.24.0",
    
    # Code Quality
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    
    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.scripts]
pr-guardian = "pr_guardian.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/pr-guardian"
Documentation = "https://pr-guardian.readthedocs.io"
Repository = "https://github.com/yourusername/pr-guardian"
Issues = "https://github.com/yourusername/pr-guardian/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pr_guardian*", "mcp_server*"]

[tool.setuptools.package-data]
pr_guardian = [
    "config/**/*.yaml",
    "config/**/*.j2",
    "py.typed",
]

# Ruff Configuration
[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

# Black Configuration
[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

# isort Configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

# MyPy Configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "pygithub.*",
    "gitlab.*",
    "radon.*",
    "bandit.*",
    "mcp.*",
]
ignore_missing_imports = true

# Pytest Configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]